<html>
    <head>
        <title>Evento</title>
        <link rel="icon" type="image/x-icon" href="/static/logo1.png">
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <style>
            /* General Reset */
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: 'Poppins', sans-serif;
            }
            
            body {
                background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
                min-height: 100vh;
                background-attachment: fixed;
            }
            
            #box {
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                padding: 20px;
                position: relative;
            }
            
            /* Header styling */
            .main-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 15px 30px;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                backdrop-filter: blur(10px);
                color: #fff;
                box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
                width: 100%;
                position: fixed;
                top: 0;
                z-index: 1000;
                border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            }
            
            .logo img {
                width: 120px;
                height: auto;
            }
            
            .nav-links ul {
                list-style: none;
                display: flex;
                gap: 3rem;
                align-items: center;
            }
            
            .nav-links ul li a {
                text-decoration: none;
                color: white;
                font-size: 16px;
                padding: 0.5rem;
                position: relative;
                transition: all 0.3s ease;
            }
            
            .nav-links ul li a:hover {
                color: #d1c4e9;
            }
            
            .nav-links ul li a::after {
                content: '';
                position: absolute;
                width: 0;
                height: 2px;
                bottom: 0;
                left: 0;
                background-color: white;
                transition: width 0.3s ease;
            }
            
            .nav-links ul li a:hover::after {
                width: 100%;
            }
            
            /* Login Form Container */
            .login-container {
                background: rgba(255, 255, 255, 0.9);
                padding: 40px;
                border-radius: 15px;
                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
                max-width: 500px;
                width: 100%;
                margin-top: 80px;
                animation: fadeInUp 0.8s ease;
            }
            
            /* Form Heading */
            .login-container h2 {
                text-align: center;
                font-size: 2rem;
                color: #333;
                margin-bottom: 1.5rem;
                font-weight: 600;
            }
            
            /* Alert Message */
            .alert {
                border-radius: 8px;
                padding: 15px;
                margin-bottom: 20px;
            }
            
            /* Input Fields */
            .form-control {
                height: 50px;
                border: 1px solid #ddd;
                border-radius: 8px;
                padding: 15px;
                font-size: 16px;
                transition: all 0.3s ease;
                margin-bottom: 15px;
            }
            
            .form-control:focus {
                border-color: #667eea;
                box-shadow: 0 0 0 0.25rem rgba(102, 126, 234, 0.25);
            }
            
            /* Button Styling */
            .btn-login {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                border: none;
                border-radius: 8px;
                padding: 12px 25px;
                font-size: 16px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.3s ease;
                width: 100%;
                margin-top: 10px;
            }
            
            .btn-login:hover {
                transform: translateY(-3px);
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            }
            
            .btn-login:active {
                transform: translateY(0);
            }
            
            /* Sign up link */
            .signup-link {
                text-align: center;
                margin-top: 20px;
                color: #666;
            }
            
            .signup-link a {
                color: #667eea;
                text-decoration: none;
                font-weight: 500;
                transition: all 0.3s ease;
            }
            
            .signup-link a:hover {
                color: #764ba2;
                text-decoration: underline;
            }
            
            /* Footer */
            .footer {
                text-align: center;
                margin-top: 30px;
                color: rgba(24, 20, 20, 0.7);
                font-size: 14px;
            }
            
            /* Animations */
            @keyframes fadeInUp {
                from {
                    opacity: 0;
                    transform: translateY(20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            
            /* Responsive Design */
            @media screen and (max-width: 768px) {
                .login-container {
                    padding: 30px;
                    margin-top: 70px;
                }
                
                .nav-links ul {
                    gap: 1.5rem;
                }
                
                .login-container h2 {
                    font-size: 1.8rem;
                }
            }
            
            @media screen and (max-width: 576px) {
                .login-container {
                    padding: 25px;
                    margin-top: 60px;
                }
                
                .main-header {
                    padding: 10px 15px;
                }
                
                .logo img {
                    width: 100px;
                }
                
                .nav-links ul {
                    gap: 1rem;
                }
                
                .nav-links ul li a {
                    font-size: 14px;
                }
            }
        </style></head>
      <body>
          <div id="box">
              <header class="main-header">
                  <div class="logo">
                      <img src="/static/logo.png" alt="Logo" />
                  </div>
                  <nav class="nav-links">
                      <ul>
                          <li><a href="/adashboard">Home</a></li>
                          <li><a href="/"><i class="fa-solid fa-right-from-bracket"></i></a></li>
                          
                      </ul>
                  </nav>
              </header>

    
        <div class="login-container">
            <h2>Success !!</h2>
            <div class="alert alert-success">
                <strong>Success!</strong> {{message}}
            </div>
        </div>
        <div class="footer">
            &copy; 2025 developed by Swastik . All rights reserved.
        </div>

    </body>
</html>
